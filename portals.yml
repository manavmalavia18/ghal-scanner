job_boards:
  - name: Hiring Cafe — US SE (entry/mid, last 4 days)
    provider: hiringcafe
    enabled: false
    skip_title_filter: true
    max_pages: 20
    searchState:
      locations:
        - formatted_address: United States
          types:
            - country
          geometry:
            location:
              lat: 33.7485
              lon: -84.3871
          id: user_country
          address_components:
            - long_name: United States
              short_name: US
              types:
                - country
          options:
            flexible_regions:
              - anywhere_in_continent
              - anywhere_in_world
      searchQuery: software engineer
      dateFetchedPastNDays: 4
      hideJobTypes:
        - Applied
      departments:
        - Software Development
        - Engineering
        - Information Technology
      roleTypes:
        - Individual Contributor
      seniorityLevel:
        - Entry Level
        - Mid Level
        - No Prior Experience Required
      securityClearances:
        - None
      sortBy: date
    notes: SEED/DISCOVER ONLY — npm run discover:boards; daily scan uses direct ATS
    skip_location_filter: true
