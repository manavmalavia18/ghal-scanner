# Legitimacy scoring (providers/_trust-validator.mjs) — built, tested, never
# enabled before now. Flags every scanned job with trustScore/trustFlags/
# trustLevel; never drops a posting, just surfaces the signal in the Jobs UI
# so you can judge for yourself. Rules: missing/invalid apply URL, known
# link-shortener domains, company-name ↔ hosting-domain mismatch (skipped
# for recognized ATS domains, since greenhouse.io/ashbyhq.com etc. never
# match the company name and that's normal, not suspicious).
trust_filter:
  enabled: true
