name: GHAL scan

on:
  schedule:
    # Every 10 minutes — application phase: every fresh posting matters more
    # than minimizing Actions spend right now. Real measured runtime is
    # ~50-57s/cycle (checkout+npm ci dominate; actual scan work is ~15-20s),
    # so at */10 this runs ~144x/day ≈ 4,100 min/month — about 1,100 min
    # over the Pro plan's 3,000 free, billed at GitHub's standard overage
    # rate (~$0.008/min for Linux ≈ $9/month). Worth it while actively
    # applying; dial back to */20-25 once the urgency passes.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ghal-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --no-audit --no-fund

      - name: Run GHAL scan
        run: node run.mjs
        env:
          GHAL_SINCE: '4'

      - name: Commit results
        run: |
          git config user.name "ghal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
