name: GHAL scan

on:
  schedule:
    # Every 25 minutes — leaves real headroom inside the GitHub Pro 3,000
    # min/month private-repo Actions budget: ~58 runs/day x ~1.5min each
    # (checkout + npm ci + scan, most cycles are fast incremental resumes)
    # ≈ ~87 min/day ≈ ~2,600/month, with slack for occasional slow/fresh
    # sweeps. Tighten toward */15 later only after watching real usage in
    # Settings → Billing → Actions minutes.
    - cron: '*/25 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ghal-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --no-audit --no-fund

      - name: Run GHAL scan
        run: node run.mjs
        env:
          GHAL_SINCE: '4'

      - name: Commit results
        run: |
          git config user.name "ghal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
