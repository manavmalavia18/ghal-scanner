name: Tracked boards scan (portals.yml)

on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: tracked-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Run tracked-boards scan
        run: node run-tracked.mjs
        env:
          TRACKED_SINCE: '1'
      - name: Commit results
        run: |
          git config user.name "ghal-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "tracked: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            for attempt in 1 2 3; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase --quiet && git push; then
                pushed=1
                break
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 3 attempts"
              exit 1
            fi
          fi
