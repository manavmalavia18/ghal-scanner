name: Push usage metrics to Grafana Cloud

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: metrics-push
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Scrape /api/metrics and remote_write to Grafana Cloud
        run: node scripts/push-metrics.mjs
        env:
          METRICS_URL: https://jobs.manavmalavia.org/api/metrics
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_INSTANCE_ID: ${{ secrets.GRAFANA_INSTANCE_ID }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
